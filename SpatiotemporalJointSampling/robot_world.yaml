world:
  height: 42
  width: 42
  step_time: 0.1
  sample_time: 0.1
  offset: [5, 5]
  collision_mode: 'stop'  # 'stop', 'unobstructed', 'reactive'
  control_mode: 'auto'  # 'keyboard', 'auto'


robot:
    kinematics: {name: 'diff'} 
    shape: {name: 'rectangle', length: 2, width: 1 , wheelbase: 0.2}
    state: [10, 40, 1.57] 
    goal: [29, 18, 3] 
    vel_min: [-5, -3]
    vel_max: [5, 3]
    goal_threshold: 0.5
    plot:
      show_trail: True
      show_goal: True

    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.28
        number: 150
        noise: True
        std: 0.02
        angle_std: 0.05
        alpha: 0.0

obstacle:
  - number: 10
    kinematics: {name: 'omni'}
    distribution: {name: 'random', range_low: [10, 10, -3.14], range_high: [40, 40, 3.14]}
    behavior: {name: 'rvo', wander: True, range_low: [10, 10, -3.14], range_high: [40, 40, 3.14], vxmax: 2, vymax: 2, factor: 5.0}
    vel_max: [2, 2]
    vel_min: [-2, -2]
    shape:
      - {name: 'circle', radius: 1.5, random_shape: True}  
      - {name: 'polygon', random_shape: true, avg_radius_range: [0.5, 1.0], irregularity_range: [0, 0.4], spikeyness_range: [0, 0.4], num_vertices_range: [4, 6]}