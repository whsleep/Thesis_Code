world:
  height: 42
  width: 42
  step_time: 0.1
  sample_time: 0.1
  offset: [5, 5]
  collision_mode: 'stop'  # 'stop', 'unobstructed', 'reactive'
  control_mode: 'auto'  # 'keyboard', 'auto'


robot:
  - kinematics: {name: 'diff'} 
    shape: {name: 'rectangle', length: 2, width: 1 , wheelbase: 0}
    state: [10, 40, 1.57] 
    goal: [29, 18, 3] 
    vel_min: [-5, -3]
    vel_max: [5, 3]
    goal_threshold: 0.5
    plot:
      show_trail: True
      show_goal: True

    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.28
        number: 150
        noise: True
        std: 0.02
        angle_std: 0.05
        alpha: 0.0

obstacle:
  - number: 10
    distribution: {name: 'random', range_low: [5, 5, -3.14], range_high: [40, 40, 3.14]}
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 1.0}  # radius
      - {name: 'circle', radius: 0.8}  # radius
      - {name: 'circle', radius: 0.8}  # radius
      - {name: 'circle', radius: 1.0}  # radius
      - {name: 'circle', radius: 0.9}  # radius

    behavior: 
      - {name: 'dash', range_low: [5, 5, -3.14], range_high: [40, 40, 3.14], wander: True}

    vel_min: [-1.0, -3.14]
    vel_max: [1.0, 3.14]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
      show_trail: False